<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPaaS Edge Monitoring Hub</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e;
          --ok:#2ea043; --warn:#d29922; --crit:#da3633; --error:#8957e5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; padding:24px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-bottom:28px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:14px 16px; border-left:4px solid var(--muted); }
  .card.OK { border-left-color:var(--ok); }
  .card.WARN { border-left-color:var(--warn); }
  .card.CRIT { border-left-color:var(--crit); }
  .card.ERROR { border-left-color:var(--error); }
  .card-name { font-weight:600; font-size:14px; }
  .card-status { font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin:2px 0 6px; }
  .card-status.OK { color:var(--ok); } .card-status.WARN { color:var(--warn); }
  .card-status.CRIT { color:var(--crit); } .card-status.ERROR { color:var(--error); }
  .card-summary { font-size:13px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:500; }
  #updated { color:var(--muted); font-size:12px; }
  @keyframes pulse-crit {
  0%, 100% { box-shadow: 0 0 0 0 rgba(218,54,51,0.5); }
  50% { box-shadow: 0 0 12px 4px rgba(218,54,51,0.5); }
}
@keyframes pulse-warn {
  0%, 100% { box-shadow: 0 0 0 0 rgba(210,153,34,0.4); }
  50% { box-shadow: 0 0 12px 4px rgba(210,153,34,0.4); }
}
.card.CRIT { animation: pulse-crit 1.6s ease-in-out infinite; }
.card.WARN { animation: pulse-warn 1.8s ease-in-out infinite; }
</style>
</head>
<body>
  <h1>📊 iPaaS Edge Monitoring Hub</h1>
  <div class="sub" id="host">Loading…</div>
  <div class="grid" id="checks"></div>
  <h2 style="font-size:15px;">Recent Metrics</h2>
  <table>
    <thead><tr><th>Time</th><th>CPU °C</th><th>RAM %</th><th>Disk</th><th>Load</th></tr></thead>
    <tbody id="metrics"></tbody>
  </table>
  <p id="updated"></p>

<script>
async function refresh() {
  try {
    const res = await fetch('status.json?_=' + Date.now());
    const data = await res.json();

    document.getElementById('host').textContent = `Host: ${data.host}`;
    document.getElementById('updated').textContent = `Last updated: ${data.generated_at}`;

    const checksEl = document.getElementById('checks');
    checksEl.innerHTML = data.checks.map(c => `
      <div class="card ${c.status}">
        <div class="card-name">${c.check_name}</div>
        <div class="card-status ${c.status}">${c.status}</div>
        <div class="card-summary">${c.summary || ''}</div>
      </div>
    `).join('');

    const metricsEl = document.getElementById('metrics');
    metricsEl.innerHTML = data.metrics.map(m => `
      <tr>
        <td>${m.timestamp}</td>
        <td>${m.cpu_temp ?? 'N/A'}</td>
        <td>${m.mem_percent}</td>
        <td>${m.disk_percent}</td>
        <td>${m.load_avg}</td>
      </tr>
    `).join('');
  } catch (e) {
    document.getElementById('host').textContent = 'Failed to load status.json';
  }
}
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
